[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
pythonPlatform = "All"
include = ["__main__.py"]
exclude = [".venv", "__pycache__"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
# These rules conflict with the selected formatter/docstring convention.
ignore = ["COM812", "ISC001", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"
